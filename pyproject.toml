[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "enip-sim"
version = "0.1.0"
description = "Simulated EtherNet/IP (CIP) devices with behaviour and fault injection: drives, I/O blocks and generic adapters, explicit and implicit messaging"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ralf Steinert"}]
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]
keywords = ["ethernet-ip", "ethernetip", "enip", "cip", "odva", "simulator", "adapter",
            "scada", "plc", "industrial automation", "test automation", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/steitec/enip-sim"
Repository = "https://github.com/steitec/enip-sim"
Changelog = "https://github.com/steitec/enip-sim/blob/main/CHANGELOG.md"
Issues = "https://github.com/steitec/enip-sim/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "pycomm3>=1.2"]

[project.scripts]
enip-sim = "enip_sim.cli:main"

[project.entry-points.pytest11]
enip_sim = "enip_sim.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.setuptools.package-data]
enip_sim = ["profiles/*.yaml"]
